services:
  - type: web
    name: nyati-era-box-cricket
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run server
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: API_KEY
        sync: false
      - key: VITE_API_KEY
        sync: false
      - key: VITE_API_URL
        value: /api
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
